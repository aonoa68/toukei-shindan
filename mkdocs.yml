site_name: 統計情報で社会・経済を診断する
site_description: 立教大学「統計情報で社会・経済を診断する」2025年度 授業資料（過去の担当授業）
site_author: 小野原 彩香
site_url: https://aonoa68.github.io/toukei-shindan/
repo_url: https://github.com/aonoa68/toukei-shindan
repo_name: aonoa68/toukei-shindan

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え
  features:
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - ja

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - ホーム: index.md
  - 各回の資料:
      - "第1回 ガイダンス": week01.md
      - "第2回 社会・経済統計へのアクセス": week02.md
      - "第3回 基本統計量に関する演習": week03.md
      - "第4回 時系列データ": week04.md
      - "第5回 時系列データに関する演習": week05.md
      - "第6回 様々な経済指標": week06.md
      - "第7回 経済指標に関する演習": week07.md
      - "第8回 地理情報を持つ統計情報から社会・経済を診断する": week08.md
      - "第9回 GISに関する演習": week09.md
      - "第10回 文章から社会・経済を診断する": week10.md
      - "第11回 テキストマイニングに関する演習": week11.md
      - "第12回 総合的な分析": week12.md
      - "第13回 総合的な分析に関する実習": week13.md
  - 担当授業の一覧（Teaching）: https://aonoa68.github.io/teaching/

copyright: © 小野原 彩香 — 立教大学「統計情報で社会・経済を診断する」（2022〜2025年度）
